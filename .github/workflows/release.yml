name: 🚀 Release packages and docs

on:
    release:
        types: [ released ]

env:
    RELEASE_VERSION: ${{ github.event.release.tag_name }}

permissions:
    contents: read
    id-token: write
    deployments: write

jobs:
    publish:
        runs-on: ubuntu-latest
        name: 🚀 Publish to Registry

        steps:
            -   name: 🔒 Validate release version
                run: |
                    if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
                        echo "::error::Invalid release version '$RELEASE_VERSION'; expected a semver like 1.2.3 or 1.2.3-beta.1."
                        exit 1
                    fi

            -   name: 👀 Checkout
                uses: actions/checkout@v6

            -   name: ⚙️ Setup node & Bun
                uses: oven-sh/setup-bun@v2

            -   name: ✨ Setup node 25.x
                uses: actions/setup-node@v6
                with:
                    node-version: '25.x'
                    registry-url: https://registry.npmjs.org

            -   name: 📦️ Install dependencies
                run: bun install --frozen-lockfile

            -   name: 🔍 Collect packages
                run: |
                    packages=()

                    for manifest in packages/*/package.json; do
                        packages+=("$(basename "$(dirname "$manifest")")")
                    done

                    echo "::notice::Releasing ${packages[*]}"
                    echo "PACKAGES=${packages[*]}" >> "$GITHUB_ENV"

            -   name: ✏️ Tag version
                run: |
                    for package in $PACKAGES; do
                        bun pm version --cwd packages/$package $RELEASE_VERSION --no-git-tag-version
                        sed -i "s/workspace:\^/^$RELEASE_VERSION/g; s/workspace:\*/$RELEASE_VERSION/g" "packages/$package/package.json"
                    done

            -   name: 🔨 Build packages
                run: |
                    for package in $PACKAGES; do
                        bun --cwd packages/$package build
                    done

            -   name: 🚀 Publish packages
                run: |
                    publish() {
                        local dir="packages/$1"
                        local name version
                        name=$(node -p "require('./$dir/package.json').name")
                        version=$(node -p "require('./$dir/package.json').version")

                        if npm view "$name@$version" version >/dev/null 2>&1; then
                            echo "::notice::$name@$version is already published, skipping."
                            return 0
                        fi

                        (cd "$dir" && npm publish --access public)
                    }

                    for package in $PACKAGES; do
                        publish "$package"
                    done

    docs:
        runs-on: ubuntu-latest
        name: 🚀 Build and deploy documentation
        needs: publish

        steps:
            -   name: 👀 Checkout
                uses: actions/checkout@v6

            -   name: ⚙️ Setup Bun
                uses: oven-sh/setup-bun@v2

            -   name: 📦️ Install dependencies
                run: bun install --frozen-lockfile

            -   name: 🔨 Build VitePress docs
                run: bun run docs:build

            -   name: 🚀 Deploy VitePress docs
                uses: cloudflare/wrangler-action@v3
                with:
                    accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                    apiToken: ${{ secrets.CLOUDFLARE_ACCOUNT_TOKEN }}
                    gitHubToken: ${{ secrets.GITHUB_TOKEN }}
                    wranglerVersion: "4.127.1"
