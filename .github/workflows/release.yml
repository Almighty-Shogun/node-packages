name: 🚀 Release packages and docs

on:
    release:
        types: [ released ]

env:
    RELEASE_VERSION: ${{ github.event.release.tag_name }}

permissions:
    contents: read
    id-token: write
    deployments: write

jobs:
    publish:
        runs-on: ubuntu-latest
        name: 🚀 Publish to Registry

        steps:
            - name: 👀 Checkout
              uses: actions/checkout@v6

            - name: ⚙️ Setup node & Bun
              uses: actions/setup-node@v6
              with:
                  node-version: '25.x'
                  registry-url: https://registry.npmjs.org
            - uses: oven-sh/setup-bun@v2

            - name: 📦️ Install dependencies
              run: bun install --frozen-lockfile

            - name: ✏️ Tag version
              run: |
                  bun pm version --cwd packages/prototype-extensions $RELEASE_VERSION --no-git-tag-version
                  bun pm version --cwd packages/utils $RELEASE_VERSION --no-git-tag-version
                  bun pm version --cwd packages/http-core $RELEASE_VERSION --no-git-tag-version
                  bun pm version --cwd packages/common $RELEASE_VERSION --no-git-tag-version
                  bun pm version --cwd packages/webkit-native-bridge $RELEASE_VERSION --no-git-tag-version
                  bun pm version --cwd packages/bun-server $RELEASE_VERSION --no-git-tag-version
                  bun pm version --cwd packages/cloudflare-worker $RELEASE_VERSION --no-git-tag-version

                  sed -i 's/workspace:\*/${{ env.RELEASE_VERSION }}/g' packages/common/package.json packages/bun-server/package.json packages/cloudflare-worker/package.json

            - name: 🔨 Build packages
              run: |
                  bun --cwd packages/prototype-extensions build
                  bun --cwd packages/utils build
                  bun --cwd packages/http-core build
                  bun --cwd packages/common build
                  bun --cwd packages/webkit-native-bridge build
                  bun --cwd packages/bun-server build
                  bun --cwd packages/cloudflare-worker build

            - name: 🚀 Publish packages
              run: |
                  bun publish --cwd packages/prototype-extensions --access public
                  bun publish --cwd packages/utils --access public
                  bun publish --cwd packages/http-core --access public
                  bun publish --cwd packages/common --access public
                  bun publish --cwd packages/webkit-native-bridge --access public
                  bun publish --cwd packages/bun-server --access public
                  bun publish --cwd packages/cloudflare-worker --access public
              env:
                  NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

    docs:
        runs-on: ubuntu-latest
        name: 🚀 Build and deploy documentation

        steps:
            -   name: 👀 Checkout
                uses: actions/checkout@v6

            -   name: ⚙️ Setup Bun
                uses: oven-sh/setup-bun@v2

            -   name: 📦️ Install dependencies
                run: bun install --frozen-lockfile

            -   name: 🔨 Build VitePress docs
                run: bun run docs:build

            -   name: 🚀 Deploy VitePress docs
                uses: cloudflare/wrangler-action@v3
                with:
                    accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                    apiToken: ${{ secrets.CLOUDFLARE_ACCOUNT_TOKEN }}
                    gitHubToken: ${{ secrets.GITHUB_TOKEN }}
                    wranglerVersion: "4.69.0"
